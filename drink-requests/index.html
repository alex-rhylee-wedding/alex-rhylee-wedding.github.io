<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drink Requests — Rhylee &amp; Alex</title>
<meta name="description" content="Request a drink for Rhylee &amp; Alex's wedding.">

<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../img/apple-touch-icon.png">
<link rel="shortcut icon" href="../img/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Alex+Brush&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/site.css">
<link rel="stylesheet" href="../css/menu.css">
</head>
<body class="site" data-root="../">

<main>
  <header class="page-header">
    <p class="eyebrow">Cheers to that</p>
    <h1 class="page-title">Drink Requests</h1>
    <span class="rule"></span>
    <p class="page-lead">Tell us what you love to drink and we'll do our best to have it on hand.</p>
  </header>

  <section class="page-body">
    <div class="wrap">
      <div class="panel-block" id="drink-form-wrap">
        <form id="drink-form" class="form-grid">
          <input type="hidden" name="form_type" value="drink_request">
          <label>Your name
            <input name="name" type="text" autocomplete="name" required>
          </label>
          <label>Drink request
            <input name="drink" type="text" placeholder="e.g. a favorite beer, wine, cocktail, or mocktail" required>
          </label>
          <label>Anything else? (optional)
            <textarea name="notes" placeholder="Brand, how you like it, a song to go with it…"></textarea>
          </label>
          <button type="submit" class="btn btn-solid">Send my request</button>
        </form>
        <div class="form-thanks" id="drink-thanks" hidden>
          <p class="script-note">Cheers!</p>
          <p>Your request is in. Feel free to send another.</p>
          <button type="button" class="btn btn-text" id="drink-again">Request another drink</button>
        </div>
      </div>
      <div class="panel-block">
        <h3>Good to know</h3>
        <p>We can't promise every request, but we'll do our best. Non-alcoholic picks are welcome too.</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <span class="footer-names">Rhylee &amp; Alex</span>
  <a href="../">Back to home</a>
</footer>

<script src="../js/menu.js"></script>
<script src="../js/drinks.js"></script>
</body>
</html>
